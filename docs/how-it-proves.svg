<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">How LastLift proves a last lift</title><desc id="d">A platform's max-flow from the street, with every lift as an edge of capacity one, equals its number of lift-disjoint step-free routes. At Alewife, lifts 813 and 961 give the Red Line platform two routes; with 961 closed, 813 is the last lift; if 813 fails too, the platform loses step-free access in the open-data model.</desc><style>
  .t { font: 650 15px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #eef1f6; }
  .tb { font: 700 17px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #f7f8fb; }
  .s { font: 400 12.5px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #a3adbe; }
  .m { font: 500 11.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #c8d1df; }
  .mm { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .h { font: 700 11px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.18em; fill: #7f8aa0; }
  .lg { font: 500 12px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #b9c2d1; }
  .n { font: 800 11px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #0b0f17; }
</style><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <radialGradient id="glowA" cx="0.18" cy="0.12" r="0.6"><stop offset="0" stop-color="#f5a524" stop-opacity="0.13"/><stop offset="1" stop-color="#f5a524" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB" cx="0.86" cy="0.9" r="0.55"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.14"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18202e"/><stop offset="1" stop-color="#131a26"/></linearGradient>
  <linearGradient id="fdb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1a12"/><stop offset="0.55" stop-color="#171b25"/><stop offset="1" stop-color="#121a22"/></linearGradient>
  <linearGradient id="edgeA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5a524"/><stop offset="1" stop-color="#e5484d"/></linearGradient>
  <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#121a2a"/><stop offset="1" stop-color="#101827"/></linearGradient>
  <filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" opacity="0.045"/></pattern>
  <marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5a524"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5484d"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2fb5a0"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6779"/></marker>
</defs><rect width="1200" height="520" rx="26" fill="url(#bg)"/><rect width="1200" height="520" rx="26" fill="url(#dots)"/><rect width="1200" height="520" rx="26" fill="url(#glowA)"/><rect x="0.5" y="0.5" width="1199" height="519" rx="26" fill="none" stroke="#273041"/><text x="48" y="56" class="h" text-anchor="start" fill="#f5a524">HOW IT PROVES IT</text><text x="48" y="92" style="font: 760 26px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#f7f8fb">max-flow  =  lift-disjoint step-free routes</text><text x="48" y="118" class="s" text-anchor="start">Give every lift capacity one. The flow from the street to a platform counts the lifts that must fail before it is cut off.</text><g filter="url(#soft)"><rect x="48" y="150" width="352" height="320" rx="16" fill="url(#card)" stroke="#283244"/></g><rect x="48" y="164" width="3" height="292" rx="1.5" fill="#2fb5a0"/><text x="70" y="182" class="t" text-anchor="start">Both lifts open</text><text x="378" y="186" text-anchor="end" style="font: 800 26px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#2fb5a0">k = 2</text><line x1="88" y1="300" x2="166" y2="300" stroke="#5d6779" stroke-width="1.6"/><line x1="166" y1="300" x2="252" y2="242" stroke="#5d6779" stroke-width="1.6"/><line x1="166" y1="300" x2="252" y2="358" stroke="#5d6779" stroke-width="1.6"/><line x1="252" y1="242" x2="348" y2="300" stroke="#f5a524" stroke-width="3"/><line x1="252" y1="358" x2="348" y2="300" stroke="#f5a524" stroke-width="3"/><circle cx="88" cy="300" r="15" fill="#8f9ab0" fill-opacity="0.12"/><circle cx="88" cy="300" r="8" fill="#0f141d" stroke="#8f9ab0" stroke-width="2.4"/><text x="88" y="332" class="m" text-anchor="middle" fill="#d7deea">street</text><circle cx="166" cy="300" r="15" fill="#8f9ab0" fill-opacity="0.12"/><circle cx="166" cy="300" r="8" fill="#0f141d" stroke="#8f9ab0" stroke-width="2.4"/><text x="166" y="332" class="m" text-anchor="middle" fill="#d7deea">entrance</text><circle cx="252" cy="242" r="15" fill="#f5a524" fill-opacity="0.12"/><circle cx="252" cy="242" r="8" fill="#0f141d" stroke="#f5a524" stroke-width="2.4"/><text x="252" y="224" class="m" text-anchor="middle" fill="#d7deea">lift 813</text><circle cx="252" cy="358" r="15" fill="#f5a524" fill-opacity="0.12"/><circle cx="252" cy="358" r="8" fill="#0f141d" stroke="#f5a524" stroke-width="2.4"/><text x="252" y="388" class="m" text-anchor="middle" fill="#d7deea">lift 961</text><circle cx="348" cy="300" r="15" fill="#2fb5a0" fill-opacity="0.12"/><circle cx="348" cy="300" r="8" fill="#0f141d" stroke="#2fb5a0" stroke-width="2.4"/><text x="348" y="332" class="m" text-anchor="middle" fill="#d7deea">Red Line</text><text x="70" y="444" class="s" text-anchor="start" fill="#2fb5a0">two independent routes</text><g filter="url(#soft)"><rect x="424" y="150" width="352" height="320" rx="16" fill="url(#card)" stroke="#283244"/></g><rect x="424" y="164" width="3" height="292" rx="1.5" fill="#f5a524"/><text x="446" y="182" class="t" text-anchor="start">961 closed (demo state)</text><text x="754" y="186" text-anchor="end" style="font: 800 26px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#f5a524">k = 1</text><line x1="464" y1="300" x2="542" y2="300" stroke="#5d6779" stroke-width="1.6"/><line x1="542" y1="300" x2="628" y2="242" stroke="#5d6779" stroke-width="1.6"/><line x1="542" y1="300" x2="628" y2="358" stroke="#5d6779" stroke-width="1.6"/><line x1="628" y1="242" x2="724" y2="300" stroke="#f5a524" stroke-width="3"/><line x1="628" y1="358" x2="724" y2="300" stroke="#e5484d" stroke-width="3" stroke-dasharray="5 5" stroke-opacity="0.8"/><circle cx="464" cy="300" r="15" fill="#8f9ab0" fill-opacity="0.12"/><circle cx="464" cy="300" r="8" fill="#0f141d" stroke="#8f9ab0" stroke-width="2.4"/><text x="464" y="332" class="m" text-anchor="middle" fill="#d7deea">street</text><circle cx="542" cy="300" r="15" fill="#8f9ab0" fill-opacity="0.12"/><circle cx="542" cy="300" r="8" fill="#0f141d" stroke="#8f9ab0" stroke-width="2.4"/><text x="542" y="332" class="m" text-anchor="middle" fill="#d7deea">entrance</text><circle cx="628" cy="242" r="15" fill="#f5a524" fill-opacity="0.12"/><circle cx="628" cy="242" r="8" fill="#0f141d" stroke="#f5a524" stroke-width="2.4"/><text x="628" y="224" class="m" text-anchor="middle" fill="#d7deea">lift 813</text><circle cx="628" cy="358" r="15" fill="#e5484d" fill-opacity="0.12"/><circle cx="628" cy="358" r="8" fill="#0f141d" stroke="#e5484d" stroke-width="2.4"/><text x="628" y="388" class="m" text-anchor="middle" fill="#d7deea">lift 961</text><path d="M622,352 L634,364 M634,352 L622,364" stroke="#e5484d" stroke-width="2.4" stroke-linecap="round"/><circle cx="724" cy="300" r="15" fill="#f5a524" fill-opacity="0.12"/><circle cx="724" cy="300" r="8" fill="#0f141d" stroke="#f5a524" stroke-width="2.4"/><text x="724" y="332" class="m" text-anchor="middle" fill="#d7deea">Red Line</text><text x="446" y="444" class="s" text-anchor="start" fill="#f5a524">813 is now the last lift</text><g filter="url(#soft)"><rect x="800" y="150" width="352" height="320" rx="16" fill="url(#card)" stroke="#283244"/></g><rect x="800" y="164" width="3" height="292" rx="1.5" fill="#e5484d"/><text x="822" y="182" class="t" text-anchor="start">813 fails too</text><text x="1130" y="186" text-anchor="end" style="font: 800 26px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#e5484d">k = 0</text><line x1="840" y1="300" x2="918" y2="300" stroke="#5d6779" stroke-width="1.6"/><line x1="918" y1="300" x2="1004" y2="242" stroke="#5d6779" stroke-width="1.6"/><line x1="918" y1="300" x2="1004" y2="358" stroke="#5d6779" stroke-width="1.6"/><line x1="1004" y1="242" x2="1100" y2="300" stroke="#e5484d" stroke-width="3" stroke-dasharray="5 5" stroke-opacity="0.8"/><line x1="1004" y1="358" x2="1100" y2="300" stroke="#e5484d" stroke-width="3" stroke-dasharray="5 5" stroke-opacity="0.8"/><circle cx="840" cy="300" r="15" fill="#8f9ab0" fill-opacity="0.12"/><circle cx="840" cy="300" r="8" fill="#0f141d" stroke="#8f9ab0" stroke-width="2.4"/><text x="840" y="332" class="m" text-anchor="middle" fill="#d7deea">street</text><circle cx="918" cy="300" r="15" fill="#8f9ab0" fill-opacity="0.12"/><circle cx="918" cy="300" r="8" fill="#0f141d" stroke="#8f9ab0" stroke-width="2.4"/><text x="918" y="332" class="m" text-anchor="middle" fill="#d7deea">entrance</text><circle cx="1004" cy="242" r="15" fill="#e5484d" fill-opacity="0.12"/><circle cx="1004" cy="242" r="8" fill="#0f141d" stroke="#e5484d" stroke-width="2.4"/><text x="1004" y="224" class="m" text-anchor="middle" fill="#d7deea">lift 813</text><path d="M998,236 L1010,248 M1010,236 L998,248" stroke="#e5484d" stroke-width="2.4" stroke-linecap="round"/><circle cx="1004" cy="358" r="15" fill="#e5484d" fill-opacity="0.12"/><circle cx="1004" cy="358" r="8" fill="#0f141d" stroke="#e5484d" stroke-width="2.4"/><text x="1004" y="388" class="m" text-anchor="middle" fill="#d7deea">lift 961</text><path d="M998,352 L1010,364 M1010,352 L998,364" stroke="#e5484d" stroke-width="2.4" stroke-linecap="round"/><circle cx="1100" cy="300" r="15" fill="#e5484d" fill-opacity="0.12"/><circle cx="1100" cy="300" r="8" fill="#0f141d" stroke="#e5484d" stroke-width="2.4"/><text x="1100" y="332" class="m" text-anchor="middle" fill="#d7deea">Red Line</text><text x="822" y="444" class="s" text-anchor="start" fill="#e5484d">loses step-free access in the open-data model</text><text x="48" y="498" class="lg" text-anchor="start">Alewife, from LastLift's data: lift 961 is closed in the demo state, so lift 813 alone serves the Red Line platform and both tracks.</text></svg>